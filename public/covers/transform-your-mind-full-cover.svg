    </style>
  </defs>

  <rect width="342.5" height="260" fill="#fff"/>

  <rect x="20" y="20" width="157.5" height="220" fill="#03050b"/>
  <rect x="20" y="20" width="145" height="33" fill="#1f1009"/>
  <path d="M22 49 L24 47 L27 50 L32 49 L36 50 L41 47.8 L45 49 L49 46.8 L54 50 L59 47.5 L64 49.5 L69 48 L75 50 L82 46.9 L89 49.2 L96 46.7 L103 48.4 L108 46.6 L114 50 L121 48 L128 49.5 L135 47.2 L142 49 L148 47.5 L154 49.6 L162 48" fill="none" stroke="#f3eee7" stroke-width="0.55"/>

  <text x="92.5" y="38.5" class="body gold" font-size="3.65" font-style="italic" font-weight="700" text-anchor="middle">There are wounds that time cannot heal on its own.</text>
  <line x1="30" y1="59" x2="155" y2="59" stroke="#5d4522" stroke-width="0.3"/>
  <circle cx="92.5" cy="59" r="1.15" fill="#f9bf3c" transform="rotate(45 92.5 59)"/>


  <text x="92.5" y="68" class="body gold" font-size="5.1" text-anchor="middle">
    <tspan x="92.5" dy="0">What happens when a child grows up carrying</tspan>
    <tspan x="92.5" dy="5.2">pain that was never given a name?</tspan>
  </text>


  <text x="92.5" y="82" class="sans muted" font-size="3.05" text-anchor="middle">
    <tspan x="92.5" dy="0">Childhood trauma does not stay in the past. It grows with us, shaping our choices,</tspan>
    <tspan x="92.5" dy="4.35">relationships, emotions, and even the way we see ourselves. But there is a path</tspan>
    <tspan x="92.5" dy="4.35">to freedom, and it begins with the courage to look within.</tspan>
  </text>


  <text x="92.5" y="100" class="body gold" font-size="3.45" text-anchor="middle">
    <tspan x="92.5" dy="0">&quot;Do not be conformed to this world, but be transformed</tspan>
    <tspan x="92.5" dy="4.7">by the renewing of your mind.&quot; Romans 12:2</tspan>
  </text>

  <line x1="41" y1="111" x2="144" y2="111" stroke="#4b371b" stroke-width="0.28"/>

  <text x="92.5" y="119" class="sans muted" font-size="3.05" text-anchor="middle">
    <tspan x="92.5" dy="0">Bringing together science, psychoanalysis, and faith, Ricardo Batista Cavassin</tspan>
    <tspan x="92.5" dy="4.35">guides the reader on a profound journey of self-knowledge. The result of nearly a</tspan>
    <tspan x="92.5" dy="4.35">decade of research and personal experience, this book offers answers where there</tspan>
    <tspan x="92.5" dy="4.35">were only questions, and hope where there was only pain.</tspan>
  </text>

  <line x1="30" y1="140.5" x2="155" y2="140.5" stroke="#5d4522" stroke-width="0.3"/>
  <circle cx="92.5" cy="140.5" r="1.15" fill="#f9bf3c" transform="rotate(45 92.5 140.5)"/>
  <text x="92.5" y="149" class="sans gold" font-size="2.75" font-weight="700" letter-spacing="0.42" text-anchor="middle">WHAT YOU WILL FIND IN THIS BOOK</text>


  <text x="35" y="158" class="body" font-size="2.95" text-anchor="start">
    <tspan x="35" dy="0">The origins of childhood trauma</tspan>
    <tspan x="35" dy="4.4">and its invisible scars;</tspan>
    <tspan x="35" dy="4.4">Causes, patterns, and the psyche's</tspan>
    <tspan x="35" dy="4.4">defense mechanisms;</tspan>
    <tspan x="35" dy="4.4">Practical tools for renewing</tspan>
    <tspan x="35" dy="4.4">the mind;</tspan>
  </text>

  <text x="96" y="158" class="body" font-size="2.95" text-anchor="start">
    <tspan x="96" dy="0">How the past appears in adult life;</tspan>
    <tspan x="96" dy="4.4"></tspan>
    <tspan x="96" dy="4.4">The path to healing: science and faith</tspan>
    <tspan x="96" dy="4.4">walking together;</tspan>
    <tspan x="96" dy="4.4">A true testimony: from pain</tspan>
    <tspan x="96" dy="4.4">to transformation.</tspan>
  </text>
  <g fill="#f9bf3c">
    <circle cx="32.5" cy="157.1" r="0.7"/><circle cx="32.5" cy="165.9" r="0.7"/><circle cx="32.5" cy="174.7" r="0.7"/>
    <circle cx="93.5" cy="157.1" r="0.7"/><circle cx="93.5" cy="165.9" r="0.7"/><circle cx="93.5" cy="174.7" r="0.7"/>
  </g>

  <line x1="30" y1="189" x2="155" y2="189" stroke="#5d4522" stroke-width="0.3"/>
  <circle cx="92.5" cy="189" r="1.15" fill="#f9bf3c" transform="rotate(45 92.5 189)"/>

  <image href="../ricardo.jpeg" x="32" y="199" width="20" height="35" preserveAspectRatio="xMidYMin slice" clip-path="url(#authorPhotoClip)"/>
  <text x="57" y="201.5" class="sans gold" font-size="2.35" font-weight="700" letter-spacing="0.25">ABOUT THE AUTHOR</text>
  <text x="57" y="207" class="body gold" font-size="4.6" font-weight="700">Ricardo Batista Cavassin</text>
  <text x="57" y="212" class="sans gold" font-size="2.35" font-weight="700" letter-spacing="0.13">PROFESSOR | HISTORIAN | PSYCHOANALYST | WRITER</text>

  <text x="57" y="217.2" class="sans muted" font-size="2.35" text-anchor="start">
    <tspan x="57" dy="0">Since 2016, Ricardo has devoted himself to the in-depth study</tspan>
    <tspan x="57" dy="3.45">of trauma and the human mind. His research grew from his own</tspan>
    <tspan x="57" dy="3.45">healing journey, becoming a reference at the intersection of</tspan>
    <tspan x="57" dy="3.45">science and biblical faith. With sensitivity and rigor, he guides</tspan>
    <tspan x="57" dy="3.45">people toward real transformation.</tspan>
  </text>


